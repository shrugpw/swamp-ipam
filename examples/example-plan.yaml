# Example: Cascade Fiber — a fictional regional ISP
# Uses RFC 9637 documentation prefix (3fff::/20).
# Copy this file and replace with your own allocation.

root: "3fff:0db8"
rootLength: 36
infraRegion: "infra"
infraSlot: "0e"
loopbackSuffix: "ffff"

